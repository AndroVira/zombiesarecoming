<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie ULTRA — от первого лица</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; display: flex; align-items: center; justify-content: center; user-select: none; }
  canvas { width: min(100vw, calc(100vh * 950 / 680)); height: auto; background: #05060a; cursor: crosshair; box-shadow: 0 0 50px #000; touch-action: none; }
  canvas:focus { outline: none; }
  #coop { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 3; font: 16px monospace; }
  #myid { color: #ffeb3b; background: #111; padding: 8px 10px; }
  #friendid { font: 16px monospace; text-transform: uppercase; width: 120px; padding: 8px; background: #111; color: #fff; border: 1px solid #546e7a; }
  #joinbtn { font: 16px monospace; padding: 8px 12px; background: #1565c0; color: #fff; border: 0; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="950" height="680" tabindex="0"></canvas>
<div id="coop">
  <span id="myid">ID</span>
  <input id="friendid" maxlength="5" autocomplete="off" placeholder="ID друга" spellcheck="false">
  <button id="joinbtn" type="button">ВМЕСТЕ</button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = canvas.width, VH = canvas.height;
const MAPW = 24, MAPH = 24;
const CAM_H = 0.5;
const FOV = 66 * Math.PI / 180;
const PLANE = Math.tan(FOV / 2);
const ORDER = ['pistol', 'shotgun', 'laser', 'minigun', 'rocket'];
const WPN = {
  pistol:  { dmg: 32, rate: 0.21, speed: 24, spread: 0.02, count: 1, color: '#ffeb3b', name: 'Пистолет', recoil: 0.02,  shake: 2.2 },
  shotgun: { dmg: 19, rate: 0.62, speed: 21, spread: 0.46, count: 6, color: '#ff6d00', name: 'Дробовик', recoil: 0.055, shake: 6 },
  laser:   { dmg: 38, rate: 0.135, speed: 34, spread: 0.012, count: 1, color: '#00e5ff', name: 'Лазер', recoil: 0.01, shake: 1.4 },
  minigun: { dmg: 16, rate: 0.085, speed: 28, spread: 0.09, count: 1, color: '#ff1744', name: 'Миниган', recoil: 0.007, shake: 1.6 },
  rocket:  { dmg: 54, rate: 0.68, speed: 13, spread: 0.04, count: 1, color: '#ff6e40', name: 'Ракетница', recoil: 0.05, shake: 5.5, big: true, splash: 2 }
};
const SHORT = { pistol: 'ПИСТ', shotgun: 'ДРОБ', laser: 'ЛАЗ', minigun: 'МИНИ', rocket: 'РАКЕ' };

const map = buildMap();
const elev = [];
for (let y = 0; y < MAPH; y++) elev.push(new Float64Array(MAPW));
const sprites = buildSprites();
const zbuf = new Float64Array(VW);
const zbufTop = new Float32Array(VW);
const occN = new Uint8Array(VW);
const occD = new Float32Array(VW * 6);
const occH = new Float32Array(VW * 6);
const JUMP_V = 5.8;
const GRAV = 12.2;
const CRATE_H = 1.08;
const FUEL_MAX = 150;
const SUMMIT = 1.08;
const FINAL_H = 5.4;
const ARENA0 = 8;
const ARENA1 = 17;
const STEP_H = 0.36;
const STAND_LIM = 6.5;

const player = {
  x: 12.5, y: 12.5, radius: 0.28, hp: 100, maxHp: 100,
  yaw: 0.35, pitch: 0, fuel: 150, weapons: ['pistol'], weapon: 'pistol',
  cool: { pistol: 0, shotgun: 0, laser: 0, minigun: 0, rocket: 0 },
  invul: 0, bob: 0, muzzle: 0, boosting: false, z: 0, vz: 0, jumps: 2, spaceWas: false,
  shieldCd: 0, shieldFlash: 0, punchCd: 0, kickCd: 0, punchAnim: 0, kickAnim: 0,
  qWas: false, eWas: false, doomed: false, climbCd: 0
};
const zombies = [];
const bullets = [];
const ebullets = [];
const loots = [];
const particles = [];
const pops = [];
const keys = {};

let boss = null;
let bossIntro = 0;
let arenaLock = false;
let sandbox = false;
let mountain = false;
let trapT = 8;
const hazards = [];
let phase = 'menu';
let wave = 1;
const DIFFS = {
  easy:   { name: 'НАЧИНАЮЩИЙ',    hp: 0.55, speed: 0.72, count: 0.55, dmg: 0.5,  fire: 1.55, boss: 0.42, towers: 1, hazard: 0.5,  minions: 3 },
  normal: { name: 'ИГРОК',         hp: 0.78, speed: 0.86, count: 0.78, dmg: 0.72, fire: 1.22, boss: 0.68, towers: 2, hazard: 0.75, minions: 4 },
  hard:   { name: 'ПРОФЕССИОНАЛ',  hp: 1,    speed: 1,    count: 1,    dmg: 1,    fire: 1,    boss: 1,    towers: 3, hazard: 1,    minions: 5 }
};
let diffId = 'hard';
function diff() { return DIFFS[diffId] || DIFFS.hard; }
function foeDmg(n) { return Math.max(1, Math.round(n * diff().dmg)); }
const remotes = [];
let netRole = 'solo';
let myId = '';
let hostId = '';
let clearedGame = false;
let diffLocked = false;
let coopMsg = 'Друг вписывает твой ID. Сложность комнаты ставится сама.';
let partyList = [];
function nearestHuman(x, y) {
  let best = null, bestD = 1e9;
  const list = [player].concat(remotes);
  for (let i = 0; i < list.length; i++) {
    const h = list[i];
    if (!h || h.hp <= 0) continue;
    const d = Math.hypot(h.x - x, h.y - y);
    if (d < bestD) { best = h; bestD = d; }
  }
  return best || player;
}
function hurtHuman(ent, dmg, srcX, srcY) {
  if (!ent || ent.hp <= 0 || ent.invul > 0) return false;
  if (ent.shieldCd <= 0 && (ent.right || (ent.keys && ent.keys.KeyF))) {
    let a = Math.atan2(srcY - ent.y, srcX - ent.x) - ent.yaw;
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) < 1.05) {
      ent.shieldCd = 3;
      popText(ent.x, ent.y, 'БЛОК', '#80d8ff');
      return true;
    }
  }
  ent.hp = Math.max(0, ent.hp - dmg);
  ent.invul = 0.45;
  popText(ent.x, ent.y, '-' + dmg, '#ff8a80');
  return true;
}
function hurtCrowd(h, reach, dmg) {
  const list = [player].concat(remotes);
  let hit = false;
  for (let i = 0; i < list.length; i++) {
    const ent = list[i];
    if (!ent || ent.hp <= 0) continue;
    const low = ent.z < h.target + (h.kind === 'spike' ? 0.45 : 0.3);
    if (!low) continue;
    let close = false;
    for (let c = 0; c < h.cells.length; c++) {
      const cell = h.cells[c];
      if (Math.hypot(ent.x - (cell.x + 0.5), ent.y - (cell.y + 0.5)) < reach) close = true;
    }
    if (!close) continue;
    if (ent === player) applyDamage(dmg, h.cx, h.cy);
    else hurtHuman(ent, dmg, h.cx, h.cy);
    hit = true;
  }
  return hit;
}
let score = 0;
let banner = '';
let bannerT = 0;
let interTimer = 0;
let mouseDown = false;
let rightMouse = false;
let debugRun = false;
let debugFreeze = false;
let lockFailed = false;
let manualPause = false;
let muted = false;
let movingAmount = 0;
let strafeVisual = 0;
let recoilPitch = 0;
let shakeAmp = 0;
let hurtFlash = 0;
let hitMark = 0;
let hurtDirT = 0;
let hurtFromX = 0, hurtFromY = 0;
let fps = 60;
let spin = 0;
let camDirX = 1, camDirY = 0, camPlaneX = 0, camPlaneY = -PLANE, camInv = 1 / PLANE, horizon = VH / 2, camEye = CAM_H;
let actx = null, noiseBuf = null;
const errors = [];
window.__errors = errors;

function dressMap(m) {
  for (let y = 0; y < MAPH; y++) {
    if (!m[y]) m[y] = [];
    for (let x = 0; x < MAPW; x++) m[y][x] = (x === 0 || y === 0 || x === MAPW - 1 || y === MAPH - 1) ? 1 : 0;
  }
  const pillar = (x, y, t) => { m[y][x] = m[y][x + 1] = m[y + 1][x] = m[y + 1][x + 1] = t; };
  pillar(4, 4, 3);
  pillar(18, 4, 3);
  pillar(4, 18, 2);
  pillar(18, 18, 2);
  for (const [x, y] of [[8, 8], [15, 8], [8, 15], [15, 15], [11, 6], [11, 16]]) {
    for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (!m[y + dy][x + dx]) m[y + dy][x + dx] = 2;
  }
}
function buildMap() {
  const m = [];
  dressMap(m);
  return m;
}
function restoreMap() {
  mountain = false;
  arenaLock = false;
  hazards.length = 0;
  for (let y = 0; y < MAPH; y++) elev[y].fill(0);
  dressMap(map);
}
function mountainH(cx, cy) {
  const d = Math.max(Math.abs(cx + 0.5 - 12.5), Math.abs(cy + 0.5 - 12.5));
  if (d <= 2.01) return SUMMIT;
  if (d <= 3.01) return SUMMIT - STEP_H;
  if (d <= 4.01) return SUMMIT - STEP_H * 2;
  if (d <= 5.01) return SUMMIT - STEP_H * 3;
  return 0;
}
function inArenaCell(cx, cy) {
  return cx >= ARENA0 && cx <= ARENA1 && cy >= ARENA0 && cy <= ARENA1;
}
function isArenaGate(cx, cy) {
  return cy === ARENA1 + 1 && cx >= 12 && cx <= 13;
}
function terraceOf(cx, cy) {
  const dx = cx < ARENA0 ? ARENA0 - cx : cx > ARENA1 ? cx - ARENA1 : 0;
  const dy = cy < ARENA0 ? ARENA0 - cy : cy > ARENA1 ? cy - ARENA1 : 0;
  return Math.max(dx, dy);
}
function finalH(cx, cy) {
  if (cx <= 0 || cy <= 0 || cx >= MAPW - 1 || cy >= MAPH - 1) return 0;
  if (inArenaCell(cx, cy)) return FINAL_H;
  const gate = isArenaGate(cx, cy);
  if (terraceOf(cx, cy) === 1 && !gate) return FINAL_H + 2.6;
  if (gate && arenaLock) return FINAL_H + 2.6;
  const h = FINAL_H - terraceOf(cx, cy) * CRATE_H;
  return h > 0.2 ? h : 0;
}
function bossVulnerable() {
  return !(wave >= 10 && mountain && !arenaLock);
}
function sealArena() {
  if (arenaLock) return;
  arenaLock = true;
  for (let y = 1; y < MAPH - 1; y++) {
    for (let x = 1; x < MAPW - 1; x++) {
      if (terraceOf(x, y) === 1) elev[y][x] = FINAL_H + 2.6;
    }
  }
  for (let i = 0; i < zombies.length; i++) zombies[i].hidden = true;
  banner = 'АРЕНА ЗАКРЫТА';
  bannerT = 1.8;
  blip(90, 0.22, 'sawtooth', 0.05, -18);
}
function touchArena() {
  if (arenaLock || wave < 10 || !mountain) return;
  const list = [player].concat(remotes);
  for (let i = 0; i < list.length; i++) {
    const ent = list[i];
    if (!ent || ent.hp <= 0) continue;
    if (!inArenaCell(Math.floor(ent.x), Math.floor(ent.y))) continue;
    if ((ent.z || 0) < FINAL_H - 0.45) continue;
    sealArena();
    return;
  }
}
function keepInArena(ent) {
  if (!arenaLock || !ent) return;
  const min = ARENA0 + 0.22;
  const max = ARENA1 + 0.78;
  if (ent.x < min) ent.x = min;
  if (ent.x > max) ent.x = max;
  if (ent.y < min) ent.y = min;
  if (ent.y > max) ent.y = max;
}
function airTop(ent, base) {
  return Math.max(base, floorAt(ent.x, ent.y) + 1.45);
}
function raiseMountain() {
  restoreMap();
  mountain = true;
  const finalBoss = wave >= 10;
  for (let y = 1; y < MAPH - 1; y++) {
    for (let x = 1; x < MAPW - 1; x++) {
      const h = finalBoss ? finalH(x, y) : mountainH(x, y);
      if (h <= 0) continue;
      map[y][x] = 4;
      elev[y][x] = h;
    }
  }
  player.x = 12.5;
  player.y = finalBoss ? 22.35 : 20.4;
  player.z = 0;
  player.vz = 0;
  player.jumps = 2;
  player.yaw = -Math.PI / 2;
  player.pitch = 0.1;
  for (let i = 0; i < remotes.length; i++) {
    remotes[i].x = player.x + 0.7 * (i + 1);
    remotes[i].y = player.y;
    remotes[i].z = 0;
    remotes[i].vz = 0;
  }
  shakeAmp = Math.max(shakeAmp, 8);
}

function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}

function buildSprites() {
  const pack = {};
  for (const kind of ['runner', 'shooter']) {
    for (let frame = 0; frame < 2; frame++) {
      pack[kind + frame] = makeSprite(80, 120, (g, w, h) => paintZombie(g, w, h, kind, frame));
    }
  }
  pack.boss = makeSprite(200, 150, paintBoss);
  pack.hero = makeSprite(80, 120, paintHero);
  pack.hp = makeSprite(64, 64, paintMedkit);
  for (const id of ORDER) pack['loot_' + id] = makeSprite(84, 48, (g, w, h) => paintGunLoot(g, w, h, WPN[id].color));
  return pack;
}

function paintZombie(g, w, h, kind, frame) {
  const skin = kind === 'runner' ? '#ffcc80' : '#dcedc8';
  const body = kind === 'runner' ? '#ef6c00' : '#2e7d32';
  const dark = kind === 'runner' ? '#e65100' : '#1b5e20';
  const swing = frame ? 7 : -7;
  g.fillStyle = '#1a1d24';
  g.fillRect(22 + swing, 78, 12, 34);
  g.fillRect(46 - swing, 78, 12, 34);
  g.fillStyle = '#37474f';
  g.fillRect(20 + swing, 106, 16, 8);
  g.fillRect(44 - swing, 106, 16, 8);
  g.fillStyle = body;
  g.fillRect(22, 48, 36, 38);
  g.fillStyle = dark;
  g.fillRect(22, 48, 36, 8);
  g.fillStyle = skin;
  g.fillRect(10, 52, 14, 28);
  g.fillRect(56, 52, 14, 26);
  g.beginPath();
  g.arc(40, 36, 16, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#b71c1c';
  g.beginPath(); g.arc(33, 34, 3.2, 0, 7); g.fill();
  g.beginPath(); g.arc(47, 34, 3.2, 0, 7); g.fill();
  g.fillStyle = '#3e2723';
  g.fillRect(34, 42, 12, 3);
  if (kind === 'shooter') {
    g.fillStyle = '#212121';
    g.fillRect(40, 58, 36, 8);
    g.fillStyle = '#ffab00';
    g.fillRect(72, 60, 8, 4);
  } else {
    g.fillStyle = '#fafafa';
    g.fillRect(8, 76, 3, 12);
    g.fillRect(13, 78, 3, 12);
    g.fillRect(64, 74, 3, 12);
    g.fillRect(69, 76, 3, 12);
  }
}

function paintHero(g) {
  g.fillStyle = '#0d47a1';
  g.fillRect(22, 78, 12, 34);
  g.fillRect(46, 78, 12, 34);
  g.fillStyle = '#1565c0';
  g.fillRect(22, 48, 36, 38);
  g.fillStyle = '#ffcc80';
  g.fillRect(10, 52, 14, 28);
  g.fillRect(56, 52, 14, 26);
  g.beginPath();
  g.arc(40, 36, 16, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#00e5ff';
  g.fillRect(36, 58, 22, 6);
}
function paintBoss(g, w, h) {
  g.fillStyle = '#4a148c';
  g.beginPath(); g.ellipse(78, 78, 58, 52, 0, 0, 7); g.fill();
  g.fillStyle = '#7c4dff';
  g.beginPath(); g.ellipse(78, 74, 42, 36, 0, 0, 7); g.fill();
  g.fillStyle = '#fff';
  g.font = 'bold 22px monospace';
  g.fillText('BOSS', 48, 82);
  g.fillStyle = '#ff1744';
  g.beginPath(); g.arc(64, 68, 5, 0, 7); g.fill();
  g.beginPath(); g.arc(96, 68, 5, 0, 7); g.fill();
  g.fillStyle = '#1a1a1a';
  g.fillRect(108, 70, 78, 18);
  g.fillStyle = '#b71c1c';
  g.fillRect(168, 74, 26, 10);
  g.fillStyle = '#ffeb3b';
  g.beginPath(); g.arc(196, 79, 6, 0, 7); g.fill();
}

function paintMedkit(g, w, h) {
  g.fillStyle = '#1b5e20';
  g.fillRect(8, 8, 48, 48);
  g.fillStyle = '#fff';
  g.fillRect(26, 14, 12, 36);
  g.fillRect(14, 26, 36, 12);
}

function paintGunLoot(g, w, h, color) {
  g.fillStyle = '#263238';
  g.fillRect(6, 16, 52, 16);
  g.fillStyle = color;
  g.fillRect(50, 20, 26, 8);
  g.fillRect(18, 8, 10, 14);
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function cellHeight(x, y) {
  const cx = Math.floor(x), cy = Math.floor(y);
  if (cx < 0 || cy < 0 || cx >= MAPW || cy >= MAPH) return 3;
  const t = map[cy][cx];
  if (t === 1) return 2.4;
  if (t === 3) return 1.7;
  if (t === 2) return CRATE_H;
  if (t >= 4 && t <= 9) return elev[cy][cx];
  return 0;
}
function standH(cx, cy) {
  if (cx < 0 || cy < 0 || cx >= MAPW || cy >= MAPH) return 0;
  const t = map[cy][cx];
  if (t === 1 || t === 3 || t === 6 || t === 7 || t === 8) return 0;
  const h = cellHeight(cx + 0.5, cy + 0.5);
  return h < STAND_LIM ? h : 0;
}
function cellSolid(x, y) { return cellHeight(x, y) > 0; }
function blockedAt(x, y, r, feet) {
  const p = [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r], [r * 0.7, r * 0.7], [r * 0.7, -r * 0.7], [-r * 0.7, r * 0.7], [-r * 0.7, -r * 0.7]];
  for (let i = 0; i < p.length; i++) if (cellHeight(x + p[i][0], y + p[i][1]) > feet + 0.44) return true;
  return false;
}
function circleBlocked(x, y, r) { return blockedAt(x, y, r, 0); }
function floorAt(x, y) {
  const cx = Math.floor(x), cy = Math.floor(y);
  if (cx < 0 || cy < 0 || cx >= MAPW || cy >= MAPH) return 0;
  const t = map[cy][cx];
  if (t === 1 || t === 3 || t === 6 || t === 7 || t === 8) return 0;
  const h = cellHeight(x, y);
  return h < STAND_LIM ? h : 0;
}
function tryMove(ent, dx, dy) {
  const r = ent.radius;
  const feet = ent.z || 0;
  if (!blockedAt(ent.x + dx, ent.y, r, feet)) ent.x += dx;
  if (!blockedAt(ent.x, ent.y + dy, r, feet)) ent.y += dy;
}
function wallBetween(x1, y1, x2, y2, clearance, z1, z2) {
  const need = clearance == null ? 0.45 : clearance;
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  const steps = Math.max(1, Math.ceil(dist / 0.12));
  const useZ = z1 != null && z2 != null;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const limit = useZ ? z1 + (z2 - z1) * t + 0.32 : need;
    if (cellHeight(x1 + dx * t, y1 + dy * t) > limit) return true;
  }
  return false;
}
function segmentWallT(x1, y1, x2, y2, clearance) {
  const need = clearance == null ? 0.45 : clearance;
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 1e-6) return cellHeight(x2, y2) > need ? 0 : null;
  const steps = Math.ceil(dist / 0.1);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    if (cellHeight(x1 + dx * t, y1 + dy * t) > need) return t;
  }
  return null;
}
function tryHop(ent, request) {
  if (ent.z == null) ent.z = 0;
  if (ent.vz == null) ent.vz = 0;
  if (ent.jumps == null) ent.jumps = 2;
  const floor = floorAt(ent.x, ent.y);
  const grounded = ent.z <= floor + 0.035 && ent.vz <= 0.08;
  if (!request || ent.jumps <= 0 || !(grounded || ent.jumps < 2)) return false;
  ent.vz = JUMP_V;
  if (ent.z < floor) ent.z = floor + 0.01;
  ent.jumps -= 1;
  return true;
}
function fall(ent, dt, cap) {
  if (ent.z == null) ent.z = 0;
  if (ent.vz == null) ent.vz = 0;
  const maxZ = cap == null ? 1.08 : cap;
  ent.vz -= GRAV * dt;
  ent.z += ent.vz * dt;
  if (ent.z > maxZ) { ent.z = maxZ; if (ent.vz > 0) ent.vz = 0; }
  const floor = floorAt(ent.x, ent.y);
  if (ent.z <= floor) {
    const impact = ent.vz;
    ent.z = floor;
    ent.vz = 0;
    ent.jumps = 2;
    return impact;
  }
  return 0;
}
function ledgeGrab(ent) {
  const reach = (ent.radius || 0.3) + 0.22;
  const samples = [[reach, 0], [-reach, 0], [0, reach], [0, -reach], [reach * 0.7, reach * 0.7], [reach * 0.7, -reach * 0.7], [-reach * 0.7, reach * 0.7], [-reach * 0.7, -reach * 0.7]];
  for (let i = 0; i < samples.length; i++) {
    const sx = ent.x + samples[i][0], sy = ent.y + samples[i][1];
    const gx = Math.floor(sx), gy = Math.floor(sy);
    if (gx < 0 || gy < 0 || gx >= MAPW || gy >= MAPH) continue;
    const gt = map[gy][gx];
    if (gt === 1 || gt === 3 || gt === 6 || gt === 7 || gt === 8) continue;
    const h = cellHeight(sx, sy);
    if (h < 0.2 || h >= STAND_LIM) continue;
    if (ent.z < h - 0.95 || ent.z > h + 0.15) continue;
    const cx = Math.floor(sx) + 0.5, cy = Math.floor(sy) + 0.5;

    if (netRole === 'guest' && msg.from === hostId && myId < hostId) {
      netRole = 'solo';
      hostId = '';
      addRemote(msg.from, msg.cleared);
    } else addRemote(msg.from, msg.cleared);
  }
  else if (msg.t === 'lobby' && netRole === 'guest' && msg.from === hostId) {
    partyList = msg.members || [];
    if (msg.diff && DIFFS[msg.diff]) { diffId = msg.diff; diffLocked = true; }
    const names = partyList.map(m => m.id + (m.cleared ? '*' : '')).join('  ');
    coopMsg = 'Комната: ' + names + (msg.diff ? '   ·   ' + DIFFS[msg.diff].name : '') + '   ·   жди НАЧАТЬ';
    joinAt = 0;
  } else if (msg.t === 'full') { coopMsg = 'В комнате уже 4 игрока'; joinAt = 0; }
  else if (msg.t === 'in' && netRole === 'host') {
    let r = null;
    for (let i = 0; i < remotes.length; i++) if (remotes[i].id === msg.from) r = remotes[i];
    if (!r) return;
    r.keys = {};
    const list = msg.keys || [];
    for (let i = 0; i < list.length; i++) r.keys[list[i]] = true;
    if (Number.isFinite(msg.yaw)) r.yaw = msg.yaw;
    if (Number.isFinite(msg.pitch)) r.pitch = clamp(msg.pitch, -0.66, 0.66);
    r.down = !!msg.down;
    r.right = !!msg.right;
    if (msg.weapon && r.weapons.indexOf(msg.weapon) >= 0) r.weapon = msg.weapon;
  } else if (msg.t === 'st' && netRole === 'guest' && msg.from === hostId) applyState(msg);
  else if (msg.t === 'again' && netRole === 'host' && (phase === 'dead' || phase === 'victory')) restart();
}
function packHuman(ent, id) {
  return {
    id: id, x: n2(ent.x), y: n2(ent.y), z: n2(ent.z), yaw: n2(ent.yaw), pitch: n2(ent.pitch),
    hp: Math.ceil(ent.hp), fuel: Math.ceil(ent.fuel), weapon: ent.weapon, weapons: ent.weapons.slice(),
    doomed: !!ent.doomed, boosting: !!ent.boosting
  };
}
function flushState() {
  const mapRows = [];
  const elevs = [];
  for (let y = 0; y < MAPH; y++) {
    let s = '';
    for (let x = 0; x < MAPW; x++) {
      s += map[y][x];
      if (elev[y][x]) elevs.push([x, y, Math.round(elev[y][x] * 100) / 100]);
    }
    mapRows.push(s);
  }
  const zs = [];
  for (let i = 0; i < zombies.length && i < 24; i++) {
    const z = zombies[i];
    if (z.hidden) continue;
    zs.push({ x: n2(z.x), y: n2(z.y), z: n2(z.z), hp: Math.ceil(z.hp), type: z.type, stun: n2(z.stun), height: z.height || 0.98, radius: z.radius || 0.32, gun: z.gun || '' });
  }
  const bs = [];
  for (let i = 0; i < bullets.length && i < 30; i++) {
    const b = bullets[i];
    bs.push({ x: n2(b.x), y: n2(b.y), z: n2(b.z), vx: n2(b.vx), vy: n2(b.vy), vz: n2(b.vz), color: b.color, big: !!b.big });
  }
  const es = [];
  for (let i = 0; i < ebullets.length && i < 30; i++) {
    const b = ebullets[i];
    es.push({ x: n2(b.x), y: n2(b.y), z: n2(b.z), vx: n2(b.vx), vy: n2(b.vy), color: b.color });
  }
  const ls = [];
  for (let i = 0; i < loots.length && i < 16; i++) {
    const l = loots[i];
    ls.push({ x: n2(l.x), y: n2(l.y), z: n2(l.z), type: l.type, wpn: l.wpn, life: n2(l.life) });
  }
  const mates = [];
  for (let i = 0; i < remotes.length; i++) mates.push(packHuman(remotes[i], remotes[i].id));
  sendAll({
    t: 'st', phase, wave, score, diff: diffId, banner, bannerT: n2(bannerT), bossIntro: n2(bossIntro),
    mountain: !!mountain, arenaLock: !!arenaLock, map: mapRows, elev: elevs, me: packHuman(player, myId), mates: mates,
    zombies: zs, boss: boss ? { x: n2(boss.x), y: n2(boss.y), z: n2(boss.z), hp: Math.ceil(boss.hp), max: boss.max, height: boss.height || 1, radius: boss.radius } : null,
    bullets: bs, ebullets: es, loots: ls
  });
}
function sendAll(msg) {
  for (let i = 0; i < remotes.length; i++) sendTo(remotes[i].id, msg);
}
function applyState(s) {
  phase = s.phase || phase;
  wave = s.wave || wave;
  score = s.score || 0;
  if (s.diff && DIFFS[s.diff]) diffId = s.diff;
  banner = s.banner || '';
  bannerT = s.bannerT || 0;
  bossIntro = s.bossIntro || 0;
  mountain = !!s.mountain;
  arenaLock = !!s.arenaLock;
  if (s.phase === 'victory') markCleared();
  if (s.map) {
    for (let y = 0; y < MAPH; y++) {
      const row = s.map[y] || '';
      elev[y].fill(0);
      for (let x = 0; x < MAPW; x++) map[y][x] = Number(row[x] || 0);
    }
    const ev = s.elev || [];
    for (let i = 0; i < ev.length; i++) if (elev[ev[i][1]]) elev[ev[i][1]][ev[i][0]] = ev[i][2];
  }
  const mine = (s.mates || []).filter(m => m.id === myId)[0];
  if (mine) {
    player.x = mine.x; player.y = mine.y; player.z = mine.z;
    player.hp = mine.hp; player.fuel = mine.fuel;
    if (mine.weapon) player.weapon = mine.weapon;
    if (mine.weapons && mine.weapons.length) player.weapons = mine.weapons.slice();
    player.doomed = !!mine.doomed;
    player.boosting = !!mine.boosting;
  }
  const others = [s.me].concat(s.mates || []).filter(m => m && m.id !== myId);
  remotes.length = 0;
  for (let i = 0; i < others.length; i++) {
    const m = others[i];
    const r = makeRemote(m.id, false);
    r.x = m.x; r.y = m.y; r.z = m.z; r.yaw = m.yaw || 0; r.pitch = m.pitch || 0;
    r.hp = m.hp; r.fuel = m.fuel; r.weapon = m.weapon || 'pistol';
    r.weapons = (m.weapons && m.weapons.slice()) || ['pistol'];
    r.doomed = !!m.doomed; r.boosting = !!m.boosting;
    remotes.push(r);
  }
  const prevBob = zombies.map(z => z.bob || 0);
  zombies.length = 0;
  const zs = s.zombies || [];
  for (let i = 0; i < zs.length; i++) {
    const z = zs[i];
    zombies.push({
      x: z.x, y: z.y, z: z.z, hp: z.hp, max: z.hp, type: z.type || 'runner', stun: z.stun || 0,
      height: z.height || 0.98, radius: z.radius || 0.32, gun: z.gun || null,
      bob: prevBob[i] || 0, flash: 0, muzzle: 0, dead: false
    });
  }
  if (s.boss) {
    if (!boss) boss = { flash: 0, muzzle: 0, bob: 0, dead: false, stun: 0 };
    boss.x = s.boss.x; boss.y = s.boss.y; boss.z = s.boss.z;
    boss.hp = s.boss.hp; boss.max = s.boss.max; boss.height = s.boss.height; boss.radius = s.boss.radius;
  } else boss = null;
  bullets.length = 0;
  const bs = s.bullets || [];
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    bullets.push({ x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz || 0, color: b.color, big: !!b.big, life: 1, trail: [{ x: b.x, y: b.y, z: b.z }], dmg: 0, hitR: 0.1, splash: 0 });
  }
  ebullets.length = 0;
  const es = s.ebullets || [];
  for (let i = 0; i < es.length; i++) {
    const b = es[i];
    ebullets.push({ x: b.x, y: b.y, z: b.z || 0.4, vx: b.vx, vy: b.vy, color: b.color, life: 1, hitR: 0.08, dmg: 0, trail: [] });
  }
  loots.length = 0;
  const ls = s.loots || [];
  for (let i = 0; i < ls.length; i++) loots.push({ x: ls[i].x, y: ls[i].y, z: ls[i].z, type: ls[i].type, wpn: ls[i].wpn, life: ls[i].life || 10, bob: i });
}
function sendInput() {
  const watch = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ShiftLeft', 'ShiftRight', 'KeyF'];
  const down = [];
  for (let i = 0; i < watch.length; i++) if (keys[watch[i]]) down.push(watch[i]);
  sendTo(hostId, { t: 'in', keys: down, yaw: player.yaw, pitch: player.pitch, down: mouseDown, right: rightMouse, weapon: player.weapon });
}
function updateMates(dt) {
  if (netRole !== 'host') return;
  for (let i = 0; i < remotes.length; i++) stepMate(remotes[i], dt);
}
function stepMate(m, dt) {
  if (m.hp <= 0) return;
  const k = m.keys || {};
  const fx = Math.cos(m.yaw), fy = Math.sin(m.yaw);
  let mx = 0, my = 0;
  if (k.KeyW) { mx += fx; my += fy; }
  if (k.KeyS) { mx -= fx; my -= fy; }
  if (k.KeyD) { mx += fy; my -= fx; }
  if (k.KeyA) { mx -= fy; my += fx; }
  const mag = Math.hypot(mx, my);
  const moving = mag > 0.01;
  const floor = floorAt(m.x, m.y);
  const shift = !!(k.ShiftLeft || k.ShiftRight);
  m.boosting = shift && m.fuel > 0 && !m.doomed;
  let speed = m.z > floor + 0.12 ? 6.2 : 4.15;
  if (m.boosting) {
    speed = 7.4;
    m.fuel = Math.max(0, m.fuel - dt);
    const canLift = !(wave >= 10 && mountain) || m.z < floor + 0.42;
    if (canLift) {
      m.vz += 16 * dt;
      if (m.vz > 2.4) m.vz = 2.4;
    } else if (m.vz > 0) m.vz = 0;
  }
  if (moving) {
    mx /= mag; my /= mag;
    tryMove(m, mx * speed * dt, my * speed * dt);
  }
  m.climbCd = Math.max(0, (m.climbCd || 0) - dt);
  const hop = !!k.Space && !m.spaceWas;
  m.spaceWas = !!k.Space;
  const intoWall = moving && !!k.KeyW && blockedAt(m.x + fx * 0.42, m.y + fy * 0.42, m.radius, m.z || 0);
  if (!m.boosting && !m.doomed && (hop || intoWall) && tryClimb(m)) {}
  else if (!m.boosting) tryHop(m, hop);
  if (!m.doomed && !m.boosting) ledgeGrab(m);
  const impact = fall(m, dt, airTop(m, 1.75));
  const landed = floorAt(m.x, m.y);
  if (m.boosting && m.fuel <= 0 && m.z > landed + 0.2) m.doomed = true;
  if (m.doomed && m.z <= landed + 0.001 && impact < 0) { m.doomed = false; m.hp = 0; }
  m.invul = Math.max(0, (m.invul || 0) - dt);
  m.shieldCd = Math.max(0, (m.shieldCd || 0) - dt);
  for (let n = 0; n < ORDER.length; n++) m.cool[ORDER[n]] = Math.max(0, (m.cool[ORDER[n]] || 0) - dt);
  if (m.down && (m.cool[m.weapon] || 0) <= 0) fireFrom(m, slopeOf(m.pitch || 0));
}
function bootNet() {
  loadProfile();
  showMyId();
  try {
    bus = new BroadcastChannel('zu-game');
    bus.onmessage = (e) => onWire(e.data);
  } catch (e) {}
  openPeer();
  setInterval(() => { if (bus) bus.postMessage({ t: 'ping', from: myId, tab: tabToken }); }, 1500);
  const btn = document.getElementById('joinbtn');
  const field = document.getElementById('friendid');
  if (btn && field) {
    const go = () => joinFriend(field.value);
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); go(); });
    field.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.code === 'Enter') { e.preventDefault(); go(); } });
  }
}
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (dt > 0 && dt < 0.1) fps += ((1 / dt) - fps) * 0.08;
  try {
    if (!debugFreeze) {
      if (phase === 'menu') player.yaw += dt * 0.18;
      else if (phase === 'victory') player.yaw += dt * 0.1;
      const bar = document.getElementById('coop');
      if (bar) bar.style.display = phase === 'menu' ? 'flex' : 'none';
      if (netRole === 'guest') {
        if (phase === 'combat' || phase === 'intermission') {
          if (!simPaused()) steerArrows(dt);
          sendInput();
          for (let i = 0; i < zombies.length; i++) zombies[i].bob += dt * 7;
        }
        if (joinAt && phase === 'menu' && performance.now() - joinAt > 7000 && coopMsg.indexOf('Подключаюсь') === 0) {
          coopMsg = 'Не вижу ' + hostId + '. Пусть друг откроет эту же игру.';
          joinAt = 0;
        }
      } else if (!simPaused()) updateGameplay(dt);
      if (netRole === 'host' && phase !== 'menu' && (!simPaused() || phase === 'dead' || phase === 'victory')) {
        netAcc += dt;
        if (netAcc >= 0.08) { netAcc = 0; flushState(); }
      }
      const cosmetic = !simPaused() || phase === 'dead' || phase === 'victory';
      if (cosmetic) {
        updateParticles(dt);
        updatePops(dt);
        decayVisuals(dt);
      }
    }
    draw(now);
  } catch (err) {
    errors.push(String(err && err.stack || err));
    console.error(err);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText(String(err && err.message || err), 20, 40);
  }
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'friendid') return;
  keys[e.code] = true;
  if (e.code === 'KeyM' && !e.repeat) muted = !muted;
  if (e.code === 'KeyR' && !e.repeat && (phase === 'dead' || phase === 'victory')) restart();
  if (e.code === 'Escape' && lockFailed && !e.repeat && (phase === 'combat' || phase === 'intermission')) manualPause = !manualPause;
  if (e.code.indexOf('Digit') === 0) selectIndex(Number(e.code.slice(5)) - 1);
  if (e.code.indexOf('Numpad') === 0 && e.code.length === 7) selectIndex(Number(e.code.slice(6)) - 1);
  if (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' || e.code === 'KeyQ' || e.code === 'KeyE' || e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code.indexOf('Arrow') === 0) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', clearKeys);
window.addEventListener('mouseup', (e) => {
  if (e.button === 2) rightMouse = false;
  else mouseDown = false;
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas) clearKeys();
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) { rightMouse = true; return; }
  if (e.button !== 0) return;
  canvas.focus();
  try { audioCtx(); } catch (err) {}
  if (phase === 'menu') {
    const p = canvasPoint(e);
    const buttons = menuButtons();
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        if (b.kind === 'diff') {
          if (diffLocked) { coopMsg = 'В комнате сложность ставится сама'; return; }
          diffId = b.id;
          return;
        }
        if (b.id === 'boss') startBossTest();
        else if (b.id === 'sandbox') startSandbox();
        else startGame();
        return;
      }
    }
    return;
  }
  if (phase === 'dead' || phase === 'victory') { restart(); return; }
  if (manualPause) manualPause = false;
  if (document.pointerLockElement !== canvas && !lockFailed && !debugRun) {
    requestLock();
    return;
  }
  mouseDown = true;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (phase !== 'combat' && phase !== 'intermission') return;
  cycleWeapon(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === canvas) {
    player.yaw -= e.movementX * 0.00235;
    player.pitch += e.movementY * 0.0022;
    player.pitch = clamp(player.pitch, -0.66, 0.66);
    return;
  }
  if (!lockFailed && !debugRun) return;
  if (phase === 'menu' || phase === 'dead' || phase === 'victory') return;
  if (!e.movementX && !e.movementY) return;
  player.yaw -= e.movementX * 0.00235;
  player.pitch += e.movementY * 0.0022;
  player.pitch = clamp(player.pitch, -0.66, 0.66);
});

function snapshot() {
  return {
    phase, wave, score, fps: Math.round(fps), diff: diffId,
    hp: player.hp, fuel: player.fuel, weapon: player.weapon,
    weapons: player.weapons.slice(),
    zombies: zombies.length,
    zombieHp: zombies.map(z => Math.round(z.hp)),
    boss: boss ? Math.round(boss.hp) : null,
    bullets: bullets.length, ebullets: ebullets.length, loot: loots.length,
    x: player.x, y: player.y, yaw: player.yaw,
    paused: simPaused()
  };
}
function step(dt) {
  dt = Math.min(0.05, Math.max(0, dt || 0));
  updateCamera();
  if (phase === 'intermission' || phase === 'combat') updateGameplay(dt);
  updateParticles(dt);
  updatePops(dt);
  decayVisuals(dt);
  draw(performance.now());
}
window.GAME = {
  player, zombies, bullets, ebullets, loots, keys, map, WPN, ORDER,
  get boss() { return boss; },
  get phase() { return phase; },
  set phase(v) { phase = v; },
  get wave() { return wave; },
  set wave(v) { wave = v; },
  get score() { return score; },
  set score(v) { score = v; },
  get debugRun() { return debugRun; },
  set debugRun(v) { debugRun = !!v; },
  get freeze() { return debugFreeze; },
  set freeze(v) { debugFreeze = !!v; },
  get mouseDown() { return mouseDown; },
  set mouseDown(v) { mouseDown = !!v; },
  get muted() { return muted; },
  cellSolid, circleBlocked, makeZombie, restart, beginWave, shoot, step, snapshot, applyDamage,
  errors
};
window.addEventListener('error', (e) => { errors.push(String(e.message)); });

updateCamera();
bootNet();
let last = performance.now();
requestAnimationFrame(loop);
</script>
