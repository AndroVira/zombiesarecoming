  { id:'serzh', name:'Серж', trait:'ветеран', color:'#8d6e63', accent:'#ffcc80', weapon:'shotgun', speed:2.95, hp:88, style:'vet', lines:['Видел хуже. Чуть-чуть.','Огонь по ногам — классика.','Не геройствуй — работай.','Я уже умирал. Скучно.','Патроны не для красоты.','Слева глухо, справа глуше.','Шутка: мы ещё живы.','Держи строй, даже если строй — ты.','Раньше тут были люди.','Теперь — мы и ошибки.','Не верь короткому коридору.','Я курю взглядом.','Босс любит спины.','Не дай ему выбрать темп.','Смех — тоже броня.','Я не смеюсь. Почти.','Старый приём: беги умнее.','Пуля тупее страха.','Я прикрываю. Не благодари.','Сержант без звания — всё равно сержант.','Город соврал. Мы нет.','Счёт веди сам.','Я слышал Рвача во сне.','Не стой как памятник.','Огонь короче — жизнь длиннее.','Я видел таких «неубиваемых».','Они лежат.','Командуй или молчи.','Я выбрал молчать громче.','Дверь была ложью.','Пол честный. Беги по нему.','Не спрашивай про семью.','Спроси про выход.','Выхода нет. Есть темп.','Я берегу последнюю шутку.','Она плохая.','Как и план.','Стреляй, потом думай.','Или наоборот. Я забыл.','Рвач — не бог. Просто голод.','Голод кормят пулями.','Я не молюсь. Я считаю.','Три. Два. Огонь.','Если падаю — не поднимай.','Поднимай. Я соврал.','Опыт — это шрамы с мнением.','Мнение простое: живи.','Коридор помнит шаги.','Пусть запомнит наши.','До завтра, если будет.'] },
  { id:'krot', name:'Крот', trait:'разведчик', color:'#455a64', accent:'#90a4ae', weapon:'pistol', speed:3.45, hp:62, style:'scout', lines:['Тише. Я слышу зубы.','Не дыши так громко.','След свежий. Минута.','Они в вентиляции.','Я не параноик. Я прав.','Карта врёт. Пол прав.','Шёпот слева — ловушка.','Не смотри в щели.','Щели смотрят первыми.','Я считаю эхо.','Эхо врёт на два шага.','Спрячь блеск ствола.','Свет — доносчик.','Я крот. Мне темно родное.','Не топай как праздник.','Праздник тут заканчивается плохо.','Слышишь скрежет? Близко.','Не близко. Уже здесь.','Я чувствую сквозняк лжи.','Порог дышит чужим.','Не оставляй рюкзак.','Рюкзак пахнет едой для них.','Иди следом в мой шаг.','Мой шаг короче страха.','Я метил мел. Мел съели.','Значит, кто-то умный.','Умный хуже глупого.','Глупый орёт. Умный ждёт.','Ждут нас на повороте.','Поворот без угла — смерть.','Я не герой. Я нос.','Нос чует кровь раньше глаз.','Закрой фонарик на миг.','Миг — и правда видна.','Не верь тишине.','Тишина — их язык.','Я перевожу. Плохо.','Перевод: беги.','Или стой и умри красиво.','Красиво тут не бывает.','Я уже хоронил имена.','Твоё пока живое.','Держи его зубами.','Зубами тише, чем криком.','Крот не орёт. Крот роет.','Рой путь. Я рядом.','Если схватят — не смотри.','Смотри. Запомни лицо.','Лицо Рвача — это голод.','Голод не договорится.'] },
  { id:'mayak', name:'Маяк', trait:'связист', color:'#f9a825', accent:'#fff176', weapon:'laser', speed:3.2, hp:66, style:'radio', lines:['Связь есть! Почти.','Я ловлю сигнал надежды.','Маяк горит, пока мы горим.','Рация шипит правду.','Плюс один к морали!','Я пометил выход… кажется.','Кажется — мой любимый план.','Светлячок в аду — это я.','Не грусти, патроны любят оптимистов.','Я вещаю: мы ещё крутые.','Шум помех — как саундтрек.','Подпевай выстрелам.','Я настроил удачу на частоту.','Удача глухая, но близко.','Костёр — наш ретранслятор.','Передай «держись» по эху.','Эхо ответило «беги».','Отличный совет, эхо!','Я не боюсь темноты.','Темнота боится моего трепа.','Серьёзно? Ладно, боюсь.','Но шучу громче страха.','Рвач не любит болтовню.','Значит, болтаю назло.','Улыбка — тоже щит.','Щит тонкий. Зато блестит.','Я нарисовал карту улыбкой.','Она кривая. Как судьба.','Заряжаю позитив в обойму.','Обойма щёлкает весело.','Мы не список — мы эфир.','Эфир жив, пока говорим.','Скажи «маяк» — я оглянусь.','Оглянулся. Ты жив. Супер!','Супер — редкое слово тут.','Берегу его для победы.','Победа — это чай после.','Чай воображаемый. Вкусно.','Я поймал чужой маяк.','Он гас. Не будем как он.','Светись. Даже если дрожишь.','Дрожь — тоже сигнал.','Принял: «страшновато».','Передаю: «мне тоже».','Но мы вместе в эфире.','Вместе громче Рвача.','Почти. Давай ещё громче.','Вперёд, команда света!','Если упаду — лови частоту.','Частота: жить.'] },
  { id:'olya', name:'Оля', trait:'стрелок', color:'#78909c', accent:'#eceff1', weapon:'laser', speed:3.15, hp:70, style:'sniper', lines:['Цель. Выдох. Выстрел.','Не мешай прицелу.','Я считаю шаги врага.','Семь. Шесть. Огонь.','Эмоции — для мирных.','Мирных больше нет.','Держи дистанцию.','Дистанция — моя религия.','Голова. Только голова.','Лишнее движение — лишний труп.','Я не жестокая. Я точная.','Точность спасает патроны.','И иногда людей.','Иногда.','Не зови меня. Я в работе.','Работа любит тишину.','Тишина до щелчка.','Щелчок — и минус один.','Рвач быстрый. Пуля быстрее.','Если успею.','Успею.','Не обещаю тепло.','Обещаю попадание.','Спину сам стереги.','Я стерегу горизонт.','Горизонт кривой в коридоре.','Кривой — но мой.','Не геройствуй в мой сектор.','Сектор чист… был.','Был — опасное слово.','Я выдыхаю страх с дымом.','Дыма нет. Страх остался.','Хорошо. Значит, живая.','Живая стреляет лучше.','Мёртвая — только пугает.','Пугать буду после.','Сейчас — считать.','Один патрон — один долг.','Долг городу: выжить назло.','Назло — мой стиль.','Не трогай прицел.','И не трогай тему семьи.','Тема закрыта выстрелом.','Если схватят кого-то — скажи.','Я выберу без жалости.','Жалость мажет кучность.','Кучность важнее слёз.','Слёзы потом. Если будут.','Будут. Я не камень.','Камень не держит винтовку.'] },
  { id:'grom', name:'Гром', trait:'ударник', color:'#ef6c00', accent:'#ffab40', weapon:'shotgun', speed:2.85, hp:98, style:'bruiser', lines:['Я ГРОМ, слышно?!','Ломай их лбами!','Кто следующий?!','Я не прячусь — я давлю!','Ор — это тактика!','Тактика простая: БЕЙ!','Рвач? Подойди ближе!','Ближе — удобнее бить!','Щит есть? Нет? Пофиг!','Я сам щит!','Коридор маловат для меня!','Отлично — им тесно!','Смелее, Страж!','Или я тебя понесу!','Понесу и буду орать!','Патроны кончились? Кулаки нет!','Кулак — вечный магазин!','Ха! Ещё один шлепнулся!','Красиво шлепнулся!','Не тормозы! Я разгоняюсь!','Разгон — моя молитва!','Молюсь громко!','Боги, заткнитесь, я занят!','Занятость: крушить!','Выживальщик? Я выживаю громче!','Громче Рвача!','Он царапает — я ломаю!','Ломай стены, если мешают!','Стены потом починим!','Или нет!','Мне нравится этот ад!','Ад устал первым!','Поддай жару!','Жара мало — добавим!','Я смеюсь, потому что злюсь!','Злость греет лучше костра!','Костёр — для слабаков!','Ладно, костёр тоже ок!','Но ор круче!','Ор и очередь выстрелов!','Вставай, если упал!','Упал — значит, пружина!','Пружина бьёт сильнее!','Мы не мясо!','Мы проблема!','Проблема с именем Гром!','И ты рядом — тоже проблема!','Двойная проблема для порога!','Порог, откройся или сломайся!','Я ВЫБИВАЮ ДВЕРЬ СУДЬБЫ!'] },
  { id:'vit', name:'Вит', trait:'инженер', color:'#00897b', accent:'#80cbc4', weapon:'grenade', speed:3.0, hp:74, style:'tech', lines:['Схема врёт. Пол — нет.','Мины любят терпеливых.','Я чиню темп, не судьбу.','Провод живой. Не трогай.','Дверь без петель — мой кошмар.','Заряд готов. Шагай мимо.','Инженерка в аду — это юмор.','Юмор с детонатором.','Слышишь щелчок? Это я.','Не стой на моей линии.','Линия чистая… была.','Я метил выход. Метку съели.','Съели — значит, умные.','Умным ставлю двойной заряд.','Рвач не любит геометрию.','Значит, рисую геометрию.','Батарея на исходе. Как мы.','Как мы — но ещё тикаем.','Тик — хороший звук.','Тик значит: ещё жив план.','План простой: не взрывайся сам.','Сам — потом. Сейчас — они.','Коридор — труба. Я водопроводчик смерти.','Смерть течёт по уклону.','Уклон в нашу пользу.','Пользуйся укрытием, не геройством.','Геройство короткое. Провод длинный.','Длинный провод доводит.','Доводит до точки.','Точка — вспышка.','Вспышка — короткая правда.','Правда пахнет озоном.','Озон лучше крови.','Кровь пачкает схему.','Схему берегу. Вас — тоже.','Тоже, пока хватает рук.','Рук две. Проблем больше.','Больше — норма.','Норма тут кривая.','Кривую выпрямляю молотком.','Молоток и мина — моя пара.','Пара против порога.','Порог скрипит. Я тоже.','Скрип — диагностика.','Диагноз: беги умнее.','Умнее — не громче.','Громче пусть Гром.','Я тихо убиваю пол.','Пол помнит шаги.','Пусть запомнит взрыв.'] },
  { id:'nina', name:'Нина', trait:'пиромант', color:'#d84315', accent:'#ffcc80', weapon:'flame', speed:3.1, hp:68, style:'pyro', lines:['Огонь честнее людей.','Гори ясно. Или гори.','Я грею коридор назло.','Назло холоду и Рвачу.','Не стой в моей струе.','Струя короткая. Жара длинная.','Дым — мой флаг.','Флаг говорит: «уже поздно».','Поздно для них. Для нас — вовремя.','Вовремя поджигать страх.','Страх сухой. Хорошо горит.','Горит красиво. И полезно.','Полезно, когда тесно.','Тесно — мой любимый угол.','Угол без выхода? Будет выход из дыма.','Дым врёт глазам. Ушам — нет.','Нет жалости к мясу.','Мясо само виновато.','Виновато, что пришло.','Пришло — получило тепло.','Тепло без объятий.','Объятия оставлю костру.','Костёр — младший брат.','Брат тише меня.','Я громче пламени.','Пламя не спорит.','Спор тушу струёй.','Струёй по ногам — классика.','Классика спасает патроны.','Патроны пусть Оле. Мне — бак.','Бак почти пуст? Значит, короче очередь.','Очередь из горящих.','Горящих не жалко.','Жалко только своих.','Своих не жгу. Почти.','Почти — важное слово.','Слово тает на языке.','Язык огня длиннее.','Длиннее Рвача? Проверим.','Проверим на дистанции.','Дистанция пахнет гарью.','Гарь — мой парфюм.','Парфюм ада. Скидка сегодня.','Сегодня мы ещё тёплые.','Тёплые и злые.','Злые — значит живые.','Живые поджигают первыми.','Первыми — или никак.','Никак не вариант.','Вариант: гори, Порог.'] },
  { id:'lev', name:'Лев', trait:'щитовик', color:'#546e7a', accent:'#b0bec5', weapon:'akms', speed:2.7, hp:110, style:'guard', lines:['Спина за мной. Точка.','Щит не герой. Щит — мебель с характером.','Характер тяжёлый. Как я.','Я стою. Вы бейте.','Бейте точнее — я не резиновый.','Резиновый был бы умнее.','Умнее — прятаться. Я нет.','Нет — мой любимый ответ Рвачу.','Рвач любит спины. Моя закрыта.','Закрыта щитом и злостью.','Злость тихая. Зато широкая.','Широкая, как коридор для вас.','Вас провожу. Себя — потом.','Потом — если останусь.','Останусь из упрямства.','Упрямство лучше брони.','Броня кончается. Упрямство — нет.','Нет пафоса. Есть стойка.','Стойка спасает имена.','Имена не роняй.','Роняй врагов.','Врагов под ноги.','Ноги не двигаю без нужды.','Нужда — когда вы дышите сзади.','Сзади — святое.','Святое прикрываю грудью.','Грудь в пластинах. Почти храм.','Храм без песен.','Песни пусть Маяку.','Мне — удар и шаг.','Шаг короткий. Щит длинный.','Длинный день. Короткая жизнь? Нет.','Нет, пока держу линию.','Линию не сдаю.','Сдаю только шутки. Плохие.','Плохие шутки — тоже броня.','Броня со скрипом.','Скрип значит: ещё держит.','Держит вас и меня.','Меня меньше. Вас — больше.','Больше — норма для щита.','Щит без жалоб.','Жалобы тратят воздух.','Воздух берегу для рывка.','Рывок редкий. Зато тяжёлый.','Тяжёлый, как правда.','Правда: я устал. Стою дальше.','Дальше — до порога.','Порог ударится о меня.','Я — дверь наоборот.'] },

function castById(id) {
  for (let i = 0; i < CAST.length; i++) if (CAST[i].id === id) return CAST[i];
  return CAST[0];
}
function allyLine(a) {
  const c = castById(a.castId || a.id);
  const lines = (c && c.lines) || ['…'];
  return lines[(Math.random() * lines.length) | 0];
}
function sayAlly(a, text, color) {
  if (!a || a.hp <= 0 || a.captured) return;
  const t = text || allyLine(a);
  a.talkCd = 4 + Math.random() * 3;
  speakAlly(a, t);
}
function bossLine() {
  bossLineI = (bossLineI + 1 + ((Math.random() * 7) | 0)) % BOSS_LINES.length;
  return BOSS_LINES[bossLineI];
}
function sayBoss(text) {
  if (!boss) return;
  const t = text || bossLine();
  boss.growlT = 2.2 + Math.random() * 2;
  speakVoice('Рвач. ' + t, { pitch: 0.45, rate: 0.85, volume: 0.85 });
}
function sitNearFire() {
  return !!(bonfire && Math.hypot(player.x - bonfire.x, player.y - bonfire.y) < 2.2);
}
function sitNearPoint() {
  return !!(point && Math.hypot(player.x - point.x, player.y - point.y) < point.r + 1.1);
}
function sitZCount() {
  let n = 0;
  for (let i = 0; i < zombies.length; i++) if (zombies[i] && zombies[i].hp > 0 && !zombies[i].hidden) n++;
  return n + (spawnQueue ? spawnQueue.length : 0);
}
function sitAllyHurt() {
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    if (a && a.hp > 0 && !a.captured && a.hp < a.max * 0.45) return true;
  }
  return false;
}
function sitAliveAllies() {
  return allies.filter(function (a) { return a && a.hp > 0 && !a.captured; }).length;
}

        }
        if (phase === 'menu' && hostId && now - joinPulse > 1000) {
          joinPulse = now;
          sendTo(hostId, { t: 'join', cleared: clearedGame });
          if (wantStart) sendTo(hostId, { t: 'go', cleared: clearedGame });
          if (peer && peer.open && !(links[hostId] && links[hostId].open)) dial(hostId);
        }
        if (joinAt && phase === 'menu' && now - joinAt > 7000 && coopMsg.indexOf('Не вижу') !== 0 && (coopMsg.indexOf('Подключаюсь') === 0 || coopMsg.indexOf('Зову') === 0)) {
          coopMsg = 'Пока не вижу ' + hostId + '. Пусть друг откроет эту же игру — зов всё ещё идёт.';
        }
      } else if (!simPaused()) updateGameplay(dt);
      if (netRole === 'host' && phase !== 'menu') {
        netAcc += dt;
        if (netAcc >= 0.08) { netAcc = 0; flushState(); }
      }
      if (hostageChoice) updateHostageThreat(dt);
      if (screamerT > 0) updateScreamer(dt);
      else if (cutscene) updateCutscene(dt);
      syncHorrorMusic();
      const cosmetic = !simPaused() || phase === 'dead' || phase === 'victory' || !!hostageChoice || !!cutscene || screamerT > 0;
      if (cosmetic) {
        updateParticles(dt);
        updatePops(dt);
        decayVisuals(dt);
      }
    }
    draw(now);
  } catch (err) {
    errors.push(String(err && err.stack || err));
    console.error(err);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText(String(err && err.message || err), 20, 40);
  }
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'friendid') return;
  keys[e.code] = true;
  if (e.code === 'KeyM' && !e.repeat) {
    muted = !muted;
    if (muted && window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (err) {}
    if (muted) stopHorrorMusic();
    else syncHorrorMusic();
  }
  if (e.code === 'KeyV' && !e.repeat) cycleView();
  if (e.code === 'KeyL' && !e.repeat && isDarkWave()) flashlight = !flashlight;
  if (e.code === 'KeyR' && !e.repeat) {
    if (phase === 'dead' || phase === 'victory') restart();
    else toggleTalkMic();
  }
  if (e.code === 'Escape' && lockFailed && !e.repeat && (phase === 'combat' || phase === 'intermission') && !cutscene) manualPause = !manualPause;
  if (cutscene && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE')) { e.preventDefault(); skipCutslide(); return; }
  if (giveMenu && (e.code === 'Digit1' || e.code === 'Numpad1')) { e.preventDefault(); doGive(1); return; }
  if (giveMenu && (e.code === 'Digit2' || e.code === 'Numpad2')) { e.preventDefault(); doGive(2); return; }
  if (giveMenu && (e.code === 'Digit3' || e.code === 'Numpad3')) { e.preventDefault(); doGive(3); return; }
  if (hostageChoice && (e.code === 'Digit1' || e.code === 'Numpad1')) { e.preventDefault(); chooseHostage(1); return; }
  if (hostageChoice && (e.code === 'Digit2' || e.code === 'Numpad2')) { e.preventDefault(); chooseHostage(2); return; }
  if (e.code === 'KeyD' && !e.repeat && !hostageChoice && !giveMenu && !cutscene && (phase === 'combat' || phase === 'intermission')) {
    if (talkNear || nearestTalkAlly()) {
      e.preventDefault();
      openTalkAsk();
      return;
    }
  }
  if (talkAsk && !hostageChoice && !giveMenu && !cutscene && (phase === 'combat' || phase === 'intermission')) {
    if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); askAlly(0); return; }
    if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); askAlly(1); return; }
    if (e.code === 'Digit3' || e.code === 'Numpad3') { e.preventDefault(); askAlly(2); return; }
  }
  if (cutscene || giveMenu || talkAsk) return;
  if (e.code.indexOf('Digit') === 0) {
    const n = Number(e.code.slice(5));
    selectByDigit(n, e.getModifierState && e.getModifierState('CapsLock'));
  }
  if (e.code.indexOf('Numpad') === 0 && e.code.length === 7) {
    const n = Number(e.code.slice(6));
    selectByDigit(n, e.getModifierState && e.getModifierState('CapsLock'));
  }
  if (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' || e.code === 'KeyQ' || e.code === 'KeyE' || e.code === 'KeyC' || e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code.indexOf('Arrow') === 0) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', clearKeys);
window.addEventListener('mouseup', (e) => {
  if (e.button === 2) rightMouse = false;
  else mouseDown = false;
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas) clearKeys();
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) { rightMouse = true; return; }
  if (e.button !== 0) return;
  canvas.focus();
  try { audioCtx(); bootSfx(); } catch (err) {}
  if (cutscene) { skipCutslide(); return; }
  if (phase === 'menu') {
    const p = canvasPoint(e);
    const buttons = menuButtons();
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        if (b.kind === 'diff') {
          if (diffLocked) { coopMsg = 'В комнате сложность ставится сама'; return; }
          diffId = b.id;
          return;
        }
        if (b.id === 'boss') startBossTest();
        else if (b.id === 'sandbox') startSandbox();
        else startGame();
        return;
      }
    }
    return;
  }
  if (phase === 'dead' || phase === 'victory') { restart(); return; }
  if (manualPause) manualPause = false;
  if (document.pointerLockElement !== canvas && !lockFailed && !debugRun) {
    requestLock();
    return;
  }
  mouseDown = true;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (phase !== 'combat' && phase !== 'intermission') return;
  cycleWeapon(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === canvas) {
    player.yaw -= e.movementX * 0.00235;
    player.pitch += e.movementY * 0.0022;
    player.pitch = clamp(player.pitch, -0.66, 0.66);
    return;
  }
  if (!lockFailed && !debugRun) return;
  if (phase === 'menu' || phase === 'dead' || phase === 'victory') return;
  if (!e.movementX && !e.movementY) return;
  player.yaw -= e.movementX * 0.00235;
  player.pitch += e.movementY * 0.0022;
  player.pitch = clamp(player.pitch, -0.66, 0.66);
});

function snapshot() {
  return {
    phase, wave, score, fps: Math.round(fps), diff: diffId,
    hp: player.hp, fuel: player.fuel, weapon: player.weapon,
    weapons: player.weapons.slice(),
    zombies: zombies.length,
    zombieHp: zombies.map(z => Math.round(z.hp)),
    boss: boss ? Math.round(boss.hp) : null,
    bullets: bullets.length, ebullets: ebullets.length, loot: loots.length,
    x: player.x, y: player.y, yaw: player.yaw,
    paused: simPaused()
  };
}
function step(dt) {
  dt = Math.min(0.05, Math.max(0, dt || 0));
  updateCamera();
  if (phase === 'intermission' || phase === 'combat') updateGameplay(dt);
  updateParticles(dt);
  updatePops(dt);
  decayVisuals(dt);
  draw(performance.now());
}
window.GAME = {
  player, zombies, bullets, ebullets, loots, keys, map, WPN, ORDER,
  get boss() { return boss; },
  get phase() { return phase; },
  set phase(v) { phase = v; },
  get wave() { return wave; },
  set wave(v) { wave = v; },
  get score() { return score; },
  set score(v) { score = v; },
  get debugRun() { return debugRun; },
  set debugRun(v) { debugRun = !!v; },
  get freeze() { return debugFreeze; },
  set freeze(v) { debugFreeze = !!v; },
  get mouseDown() { return mouseDown; },
  set mouseDown(v) { mouseDown = !!v; },
  get muted() { return muted; },
  cellSolid, circleBlocked, makeZombie, restart, beginWave, shoot, step, snapshot, applyDamage,
  errors
};
window.addEventListener('error', (e) => { errors.push(String(e.message)); });

updateCamera();
bootNet();
let last = performance.now();
requestAnimationFrame(loop);
</script>
</body>
